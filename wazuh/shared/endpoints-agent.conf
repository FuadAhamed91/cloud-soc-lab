<!--
  Centralised agent config for the "endpoints" group.
  Pushed to the manager at /var/ossec/etc/shared/endpoints/agent.conf so every enrolled
  endpoint collects the right telemetry without editing each agent by hand.

  OS-filtered so Windows agents pull Sysmon and Linux agents pull auditd.
-->
<agent_config os="Windows">
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>

<agent_config os="Linux">
  <localfile>
    <location>/var/log/audit/audit.log</location>
    <log_format>audit</log_format>
  </localfile>
</agent_config>
